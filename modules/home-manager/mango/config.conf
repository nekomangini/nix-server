# ---------- Startup / Noctalia ----------
exec_once=noctalia
layer_animations=0
blur_layer=0

# ---------- Appearance ----------
focused_opacity=0.75
unfocused_opacity=0.5
blur=1
blur_optimized=1
border_radius=2

# ---------- Layouts ----------
circle_layout=tile,center_tile,dwindle,scroller,monocle
default_master_factor=0.6
deck_tab_mode=1

tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:center_tile
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller

# ---------- App -> tag ----------
window_rule=tags:1,app_id:^vivaldi-stable$
window_rule=tags:1,app_id:^kitty$
window_rule=tags:1,app_id:^emacs$
window_rule=tags:2,app_id:^(org\.kde\.dolphin|org\.kde\.gwenview|easytag|joplin-app-desktop)$
window_rule=tags:3,app_id:^(blender|krita|gimp|PixiEditor\.Desktop|Godot)$
window_rule=tags:4,app_id:^(org\.pwmt\.zathura|org\.kde\.okular)$
window_rule=tags:5,app_id:^jetbrains-studio$

# ---------- Opaque apps (everything else keeps global opacity) ----------
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(vivaldi-stable|org\.kde\.dolphin|org\.kde\.gwenview|easytag|joplin-app-desktop)$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(blender|krita|gimp|PixiEditor\.Desktop|Godot)$
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(org\.pwmt\.zathura|org\.kde\.okular|jetbrains-studio)$

# ---------- Floating ----------
window_rule=is_floating:1,width:1080,height:920,app_id:^dev\.noctalia\.Noctalia$

# ---------- Noctalia ----------
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,x,spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,x,spawn,noctalia msg session lock
bind=SUPER+SHIFT,c,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+SHIFT,comma,spawn,noctalia msg settings-toggle

bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next

# ---------- Apps ----------
bind=SUPER,t,spawn,dev-workspace-wayland
bind=SUPER,e,spawn,emacs-gui-wayland
bind=SUPER,y,spawn,emacs-dired-wayland
bind=SUPER,a,spawn,alacritty
# bind=SUPER,b,spawn,wayland-websearch

# ---------- Window basics ----------
bind=SUPER,r,reload_config
bind=SUPER,q,killclient,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER,v,togglefloating,
bind=SUPER,space,zoom,

# ---------- Vim focus / move / resize ----------
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right

bind=SUPER+ALT,h,setmfact,-0.05
bind=SUPER+ALT,l,setmfact,+0.05

# ---------- Tags ----------
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5

bind=SUPER,p,viewtoleft
bind=SUPER,n,viewtoright
bind=SUPER,backslash,view,-1

# ---------- Overview ----------
bind=SUPER,o,toggleworkspaceoverview,all
bind=SUPER,u,toggleworkspaceoverview,scroll_all
bind=SUPER,i,leaveworkspaceoverview,
bind=SUPER,semicolon,togglejump,
bind=SUPER,bracketright,overcircle,next
bind=SUPER,bracketleft,overcircle,prev

# ---------- Monocle layout ----------
# No tab bar, no window borders, keep gaps around windows
monocle_tab_mode=0
monocle_no_border=1
monocle_no_gap=0

# ---------- Layout switching ----------
bind=SUPER,Tab,switch_layout,
bind=SUPER,apostrophe,setlayout,tile
bind=SUPER+ALT,apostrophe,setlayout,monocle
bind=SUPER+SHIFT,apostrophe,setlayout,scroller

source=~/.config/mango/noctalia.conf
